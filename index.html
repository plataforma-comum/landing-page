<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV 3.0 - Plataforma Comum</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #091622; /* Mantido o fundo azul caso a imagem demore a carregar */
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center; /* Centraliza verticalmente se a imagem for menor que a tela */
        align-items: center;
      }

      .responsive-img {
        width: 100%;
        height: auto; /* Mantém a proporção original da imagem */
        display: block; /* Remove espaços em branco indesejados abaixo da imagem */
      }
    </style>
  </head>
  <body>

    <!-- Substitua "seu-arquivo-de-imagem.jpg" pelo caminho/nome real da sua imagem -->
    <img src="Plataforma-em-Desenvolvimento.jpg" alt="TV 3.0 - Plataforma Comum" class="responsive-img">

  </body>
</html>
